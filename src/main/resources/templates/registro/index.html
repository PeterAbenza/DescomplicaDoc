<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DescomplicaDoc | Cadastro</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <link rel="shortcut icon" href="/img/logoSolo.png" />
</head>
<body>
    <div class="login-box" data-aos="fade-up">
        <h2>Crie sua conta</h2>
        <form method="post" th:action="@{/register}">
            <div class="form-group">
                <label for="nome">Nome completo</label>
                <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu e-mail" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Crie uma senha" required>
            </div>
            <div class="form-group">
                <label for="confirmarSenha">Repetir Senha</label>
                <input type="password" class="form-control" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha" required>
                <small id="senhaHelp" class="form-text text-muted">As senhas devem ser iguais.</small>
            </div>
			
			<div th:if="${error}" class="alert alert-danger">
			    <p th:text="${error}"></p>
			</div>

            <!-- Campo oculto para plano gratuito (Starter) -->
            <input type="hidden" name="planoId" value="1">  <!-- Plano Starter -->

            <button type="submit" class="btn btn-custom btn-block">Cadastrar</button>
            <div class="text-center mt-3">
                <a href="/login" class="text-light">Já tem conta? Entrar</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
        AOS.init();

        // Validação de senhas no formulário
        document.querySelector('form').addEventListener('submit', function (event) {
            var senha = document.getElementById('senha').value;
            var confirmarSenha = document.getElementById('confirmarSenha').value;
            if (senha !== confirmarSenha) {
                event.preventDefault();  // Impede o envio do formulário
                alert('As senhas não coincidem!');
            }
        });
    </script>
</body>
</html>
