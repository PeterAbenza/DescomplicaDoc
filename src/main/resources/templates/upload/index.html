<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DescomplicaDoc - Chat IA</title>
	<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
	<link rel="stylesheet" href="/css/index.css">
	<link rel="shortcut icon" href="/img/logoSolo.png" />
	<style>
		/* Estilos existentes */
		body {
			background-color: #262626;
			color: #fff;
		}
		.chat-wrapper {
			display: flex;
			justify-content: center;
			align-items: center;
			height: 90vh;
			margin-top: 50px;
			margin-bottom: 80px;
		}
		.chat-container {
			width: 100%;
			max-width: 700px;
			height: 80vh;
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			padding: 20px;
			border-radius: 10px;
			background-color: #1f1f1f;
			box-shadow: 0 0 15px rgba(0, 0, 0, 0.4);
		}
		.chat-box {
			flex-grow: 1;
			overflow-y: auto;
			display: flex;
			flex-direction: column;
			gap: 10px;
			margin-bottom: 15px;
		}
		.message {
			padding: 10px 15px;
			border-radius: 20px;
			margin-bottom: 10px;
			max-width: 75%;
		}
		.ia-message {
			background-color: #333;
			align-self: flex-start;
			color: #ddd;
		}
		.user-message {
			background-color: #6a1b9a;
			align-self: flex-end;
			color: white;
		}
		.chat-input-area {
			margin-top: 10px;
		}
		.custom-file-label,
		.form-control {
			background-color: #2a2a2a;
			color: #ddd;
			border: 1px solid #444;
		}
		.custom-file-input:focus~.custom-file-label {
			border-color: #6a1b9a;
			box-shadow: none;
		}
		.btn-success {
			background-color: #6a1b9a;
			border-color: #6a1b9a;
		}
		.btn-success:hover {
			background-color: #7c2bb3;
		}
		.custom-file-label::after {
			content: "Procurar";
			background-color: #444;
			color: #ccc;
		}
	</style>
</head>

<body>

	<div th:replace="~{fragmentos/frag :: cabecalho}"></div>

	<div class="container-fluid chat-wrapper">
		<div class="chat-container">
			<!-- Mensagens -->
			<div class="chat-box" id="chat-box">
				<div class="message ia-message">Olá! Envie seu documento para resumir.</div>
				<!-- Exibir o resumo retornado do Controller -->
				<div th:each="resumo : ${resumos}" class="message ia-message">
				     <span th:text="${resumo}"></span>
				</div>
			</div>

			<!-- Área de input e upload -->
			<div class="chat-input-area">
				<form method="post" action="/upload-pdf" enctype="multipart/form-data">
					<div class="custom-file mb-2">
						<input type="file" class="custom-file-input" id="pdfFile" name="file" accept="application/pdf"
							required>
						<label class="custom-file-label" for="pdfFile">Envie um PDF...</label>
					</div>
					<button type="submit" class="btn btn-success btn-block">
						<i class="fas fa-upload mr-2"></i> Enviar PDF para Análise
					</button>
				</form>
			</div>
		</div>
	</div>

	<div th:replace="~{fragmentos/frag :: rodape}"></div>

	<script>
		document.querySelector('.custom-file-input').addEventListener('change', function (e) {
			var fileName = e.target.files[0]?.name || "Escolha um arquivo";
			e.target.nextElementSibling.innerText = fileName;
		});

		// Scroll automático para o fim do chat
		window.addEventListener('load', function () {
			const chatBox = document.getElementById('chat-box');
			if (chatBox) {
				chatBox.scrollTop = chatBox.scrollHeight;
			}
		});
	</script>


</body>

</html>
